spring:
  application:
    name: fabric-spring-backend

server:
  port: 8080

# Hyperledger Fabric connection settings
fabric:
  msp-id: Org1MSP
  channel-name: mychannel
  chaincode-name: asset-transfer
  peer:
    endpoint: localhost:7051
    tls-cert-path: ${FABRIC_TLS_CERT_PATH:../fabric-network/organizations/org1/peers/peer0/tls/ca.crt}
  gateway:
    cert-path: ${FABRIC_CERT_PATH:../fabric-network/organizations/org1/users/User1@org1.example.com/msp/signcerts/cert.pem}
    key-path: ${FABRIC_KEY_PATH:../fabric-network/organizations/org1/users/User1@org1.example.com/msp/keystore/}

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /api-docs

logging:
  level:
    org.fabric: DEBUG
    org.hyperledger: INFO
