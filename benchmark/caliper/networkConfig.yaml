# networkConfig.yaml — Cấu hình mạng Fabric cho Caliper (caliper-fabric 2.x / gateway 2.4).
# Path crypto material lấy đúng từ application.yml của backend (đã chạy thật).
name: TrustID-Caliper-Network
version: "2.0.0"
caliper:
  blockchain: fabric

channels:
  - channelName: mychannel
    contracts:
      - id: identity-ledger

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: User1
          clientPrivateKey:
            path: /home/minhphuonglcby/identity-fabric/fabric-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/priv_sk
          clientSignedCert:
            path: /home/minhphuonglcby/identity-fabric/fabric-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem
    connectionProfile:
      path: ./connection-org1.yaml
      discover: true
